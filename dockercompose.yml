services:
  app:
    build: .
    container_name: node-app
    ports:
      - "8080:8080"
    environment:
      #just for meme
      - NODE_ENV=production
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=example
      - DB_NAME=myapp
      #just for meme
    depends_on:
      - db
    volumes:
      - .:/app
      - /app/node_modules
    command: ["node", "dist/index.js"]
    restart: always

  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: myapp
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
